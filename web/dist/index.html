<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Notes Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="tool-group">
        <button id="add-paragraph" title="添加段落">段落</button>
        <button id="add-heading" title="添加标题">标题</button>
        <button id="add-todo" title="添加待办">待办</button>
      </div>
      <div class="tool-group icon-tools">
        <button id="bold" title="加粗"><strong>B</strong></button>
        <button id="italic" title="斜体"><em>I</em></button>
        <button id="highlight" title="高亮">▰</button>
        <label class="color-tool" title="文字颜色"><input id="text-color" type="color" value="#182230"><span>A</span></label>
        <label class="color-tool" title="块背景色"><input id="background-color" type="color" value="#fff2a8"><span>■</span></label>
        <button id="outdent" title="提升层级">←</button>
        <button id="indent" title="缩进为子级">→</button>
        <button id="move-up" title="向上移动">↑</button>
        <button id="move-down" title="向下移动">↓</button>
      </div>
      <div class="tool-group"><button id="undo" title="撤销 (Ctrl+Z)" disabled>↶</button><button id="redo" title="重做 (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷</button><button id="history">历史记录</button></div>
      <span id="status">加载中</span>
    </header>
    <div id="link-suggestions" class="link-suggestions" hidden></div>
    <div class="workspace">
      <article class="editor">
        <input id="title" placeholder="未命名笔记" autocomplete="off">
        <section id="blocks"></section>
      </article>
      <aside class="relations">
        <section id="history-panel" hidden></section>
        <section><h2>反向链接</h2><div id="backlinks"></div></section>
        <section><h2>外部覆写</h2><div id="override-notices"></div></section>
      </aside>
    </div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
